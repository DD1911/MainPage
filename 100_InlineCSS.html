<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline CSS per style-Elemente einbinden</title>
    <style>
        h1 {
            color: blue;
            font-size:60px
        }
        p {
            color: blue;
        }
        /*
        In CSS gibt es nur die Kommentar-Art mit öffnendem /*
        und schliessendem kommentar zeichen */
         */
         */
    </style>
</head>
<body>

<h1 style="color: chartreuse; font-size:60px">Das HTML style-Attribut</h1>

#Erstes P kann hier im code oder oben in deer zeile
die Farbe zugewisen werden.
<p>
    HTML-Attribute müssen in dem öffenden Tag stehen.
</p>

#Zweites P
<p>
    Das sytle-Element zum Einbinden von CSS.
</p>


</body>
</html>
