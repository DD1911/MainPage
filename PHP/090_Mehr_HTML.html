<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- =========================================================
         TITLE UND META-DATEN
         ---------------------------------------------------------
         - <title> erscheint im Browser-Tab.
         - <meta charset="UTF-8"> sorgt dafür, dass Umlaute (ä, ö, ü) korrekt angezeigt werden.
         - <meta name="viewport"> ist Pflicht für responsive Webseiten
           (macht die Seite auf Handy & Tablet lesbar).
         ========================================================= -->
    <title>Fortgeschrittenes HTML – Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO (Suchmaschinenoptimierung):
         Suchmaschinen nutzen diese Infos, um die Seite zu verstehen -->
    <meta name="description" content="Eine Demo-Seite für fortgeschrittenes HTML mit ausführlichen Kommentaren.">
    <meta name="robots" content="index, follow">

    <!-- Social Media Vorschau (Open Graph):
         Diese Infos werden z. B. auf Facebook/Twitter angezeigt -->
    <meta property="og:title" content="HTML Fortgeschrittene Demo">
    <meta property="og:description" content="Eine Beispielseite mit modernen HTML-Features.">
    <meta property="og:image" content="bild.jpg">

    <!-- Inline CSS für Layout – normalerweise in separater Datei -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        header, nav, main, section, footer {
            border: 1px solid #ccc; /* sichtbarer Rahmen für Lernzwecke */
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px; /* abgerundete Ecken */
        }

        nav a {
            margin-right: 10px;
        }

        /* Responsive Design Beispiel:
           Wenn Bildschirm kleiner als 600px → Text kleiner */
        @media (max-width: 600px) {
            body { font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- =========================================================
     SEMANTISCHE STRUKTUR
     ---------------------------------------------------------
     Früher hat man <div> für alles benutzt. Heute nimmt man
     aussagekräftige Elemente wie <header>, <nav>, <main>, <footer>.
     - Vorteil: bessere Lesbarkeit, SEO, Barrierefreiheit
     ========================================================= -->
<header>
    <h1>Fortgeschrittenes HTML</h1>
    <p>Eine Beispielseite mit ausführlichen Kommentaren</p>
</header>

<nav>
    <!-- Navigation (Menü mit internen Sprungmarken) -->
    <a href="#formulare">Formulare</a>
    <a href="#multimedia">Multimedia</a>
    <a href="#seo">SEO & Accessibility</a>
</nav>

<main>
    <!-- Hauptinhalt der Seite -->

    <!-- =====================================================
         FORMULARE MIT VALIDIERUNG
         -----------------------------------------------------
         HTML5 bringt viele eingebaute Eingabetypen (type="...")
         und Validierungen (required, minlength, max, usw.).
         Diese laufen direkt im Browser ohne JavaScript!
         ===================================================== -->
    <section id="formulare">
        <h2>Formulare mit Validierung</h2>
        <form>
            <!-- E-Mail muss korrektes Format haben -->
            <label for="email">E-Mail:</label>
            <input type="email" id="email" name="email" required>

            <!-- Nur Zahlen zwischen 18 und 99 erlaubt -->
            <label for="age">Alter:</label>
            <input type="number" id="age" name="age" min="18" max="99">

            <!-- Passwort mit Mindestlänge -->
            <label for="password">Passwort:</label>
            <input type="password" id="password" name="password" minlength="6" required>

            <button type="submit">Absenden</button>
        </form>
    </section>

    <!-- =====================================================
         MULTIMEDIA
         -----------------------------------------------------
         HTML5 ermöglicht Video, Audio und SVG direkt im Browser,
         ohne externe Plugins (früher Flash).
         ===================================================== -->
    <section id="multimedia">
        <h2>Multimedia</h2>

        <!-- Video mit Steuerung (Play/Pause etc.) -->
        <video controls width="300">
            <source src="video.mp4" type="video/mp4">
            Dein Browser unterstützt kein Video.
        </video>

        <!-- Audio mit Steuerung -->
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Dein Browser unterstützt kein Audio.
        </audio>

        <!-- SVG: Vektorgrafik, beliebig skalierbar -->
        <svg width="100" height="100">
            <circle cx="50" cy="50" r="40" fill="lightblue" stroke="black" stroke-width="2" />
        </svg>
    </section>

    <!-- =====================================================
         SEO & BARRIEREFREIHEIT (Accessibility)
         -----------------------------------------------------
         - alt-Attribute für Bilder
         - aria-Attribute für Screenreader
         - tabindex für Tastaturnavigation
         ===================================================== -->
    <section id="seo">
        <h2>SEO & Barrierefreiheit</h2>

        <!-- alt-Text beschreibt das Bild für Suchmaschinen & Screenreader -->
        <img src="bild.jpg" alt="Eine Landschaft mit Bergen und See" width="200">

        <!-- aria-label erklärt Screenreadern, was dieser Button macht -->
        <button aria-label="Menü öffnen">☰</button>

        <!-- tabindex=0 macht den Link mit Tab-Taste erreichbar -->
        <a href="#formulare" tabindex="0">Zum Formular springen</a>
    </section>

    <!-- =====================================================
         HTML5 APIS
         -----------------------------------------------------
         Browser bieten zusätzliche Schnittstellen.
         Beispiel: Geolocation API, um den Standort zu ermitteln.
         ===================================================== -->
    <section>
        <h2>HTML5 APIs</h2>
        <button onclick="navigator.geolocation.getCurrentPosition(
                pos => alert('Dein Breitengrad: ' + pos.coords.latitude)
            )">
            Standort anzeigen
        </button>
    </section>
</main>

<!-- =========================================================
     FOOTER
     ---------------------------------------------------------
     Fußzeile der Seite, z. B. für Copyright.
     ========================================================= -->
<footer>
    <p>&copy; 2025 Fortgeschrittene HTML-Demo</p>
</footer>

</body>
</html>
