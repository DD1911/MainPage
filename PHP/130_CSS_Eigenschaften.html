<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS-Eigenschaften</title>
    <style>
        h1 {
            color: chocolate;
            background-color: black;
            font-size: 40px;
            font-family: "Calibri Light";

        }
        p {
            color: chocolate;
            background-color: #ffffff;
            /* RGB-Farbmodell: Rot-Grün-Blau */

            color: #FF0000;
            color: #00FF00;
            color: #0000FF;

            /* Wenn alle drei Werte jeweils die gleichen Ziffern haben,
            kann man auch jede Ziffern nur einmal hinschreiben */
            color: #00F;                /*blau*/

            color: rgb(0, 255, 0);      /*grün*/

            /*Der Vierte wert (alpha-Kanal) bestimmt die deckkraft
            und ist ein wert zwischen 0 und1. */
            color: rgba(0, 255, 0, 1);

            /*Größe*/
            font-size: 40px;
            color: steelblue;

            /*Schrift-Art*/
            /*Der Browser nimmt die erste schrift und wenn er die nicht
            findet, nimmt er die nächste.
            Es gibt Schrift-Gruppen: monoscape,serif, sankt-serif
            */
            font-family: Calibri;
        }
        /*Schrift->Stärke*/
        p{
            font-weight:bold;           /* Entspricht 700*/
            font-weight: normal;        /* Entspricht 400*/
            font-weight: 900;           /* 100 ganz dünn und 900 ganz fett*/
        }

    </style>
</head>
<body>

<h1>CSS-Eigenschaften</h1>

<p>CSS steht für Cascading Sytles Sheets </p>

</body>
</html>
